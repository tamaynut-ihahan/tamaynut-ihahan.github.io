{%- comment -%} نص طويل بلغتين مع أزرار التبديل، والأمازيغية أولاً: include bilingual.html ar=content tz=page.tz {%- endcomment -%}
{%- if include.tz -%}
<div class="bi" data-show="tz">
  <div class="tabs" role="tablist" aria-label="لغة النص">
    <button role="tab" class="t-tz" data-l="tz" aria-selected="true" lang="zgh">ⵜⴰⵎⴰⵣⵉⵖⵜ</button>
    <button role="tab" data-l="ar" aria-selected="false">العربية</button>
  </div>
  <div class="pane-tz" lang="zgh">
{{ include.tz | markdownify }}
  </div>
  <div class="pane-ar">
{{ include.ar }}
  </div>
</div>
{%- else -%}
{{ include.ar }}
{%- endif -%}
