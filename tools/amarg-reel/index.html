<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>ⴰⵎⴰⵔⴳ — reel</title>
<!--
  ريلز برنامج ⴰⵎⴰⵔⴳ: صورة الفنان خلفية، ومقطع من أغنيته — 1080×1920.
  كل شيء يُرسم بالدالة render(t) (t بالثواني)، فكل إطار حتمي.
  - النصوص: الكائن TEXT أسفله.  - التوقيت: الكائن TL.
  - الصورة وموضعها والمدة: config.json (يمررها render.js في window.__CFG__).
-->
<style>
@font-face{font-family:Adlis;src:url(../../brand/fonts/Adlis-tt.ttf) format("truetype");}
@font-face{font-family:Tajawal;font-weight:500;src:url(../../brand/fonts/Tajawal-Medium.ttf) format("truetype");}

:root{--navy:#1A2B5E;--blue:#1F56C0;--gold:#E9B84A;--cream:#FBF7EE;--paper:#F3EEE3}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0B1330}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden}
.abs{position:absolute}
.tf{font-family:Adlis;direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.lat{font-family:Tajawal;direction:ltr;white-space:nowrap}

/* الخلفية: صورة الفنان (cover) + تعتيم أغمق في الأعلى والأسفل بطابع ترابي */
#photo{left:0;top:0;height:1920px;width:auto;filter:blur(1.2px) sepia(.18) saturate(1.05)}
#shade{inset:0;background:linear-gradient(180deg,
  rgba(20,12,4,.86) 0%, rgba(20,12,4,.55) 18%, rgba(20,12,4,.45) 40%, rgba(20,12,4,.5) 58%,
  rgba(14,10,6,.8) 74%, rgba(10,8,6,.92) 100%)}
#grain{left:0;top:0;width:1080px;height:1920px;mix-blend-mode:overlay;opacity:.4}

/* الشعار في الزاوية اليسرى العليا، داخل لوحة فاتحة (الدليل: على خلفية داكنة) */
#logo{left:24px;top:30px;background:var(--cream);border-radius:22px;padding:14px 16px;
  box-shadow:0 14px 34px rgba(0,0,0,.45)}
#logo img{display:block;width:298px}

/* اسم البرنامج في الزاوية اليمنى العليا */
#prog{right:36px;top:46px;font-size:92px;line-height:1;color:var(--cream);
  text-shadow:0 0 18px rgba(0,0,0,.75)}

/* اسم الأغنية، ثم المعيّن بين خطين، ثم اسم الفنان */
#song{left:0;width:1080px;text-align:center;top:0;color:var(--cream);transform-origin:50% 50%}
#song .tf{font-size:var(--song-size,110px);line-height:1.1;text-shadow:0 0 22px rgba(0,0,0,.8)}
#halo{left:0;width:1080px;text-align:center;top:0;color:var(--gold);filter:blur(22px);transform-origin:50% 50%}
#halo .tf{font-size:var(--song-size,110px);line-height:1.1}
#orn{left:360px;width:360px;height:24px;display:flex;align-items:center;gap:22px}
#orn i{flex:1;height:2px;background:var(--gold);opacity:.7}
#orn img{width:22px;height:22px}
#artist{left:0;width:1080px;text-align:center;font-size:80px;line-height:1.1;color:var(--cream);
  text-shadow:0 0 14px rgba(0,0,0,.8)}

/* صفحة فيسبوك والموقع */
#fb{left:0;width:1080px;display:flex;justify-content:center;align-items:center;gap:16px;direction:ltr;color:var(--cream)}
#fb svg{width:44px;height:44px;flex:none}
#fb .tf{font-size:36px}
#fb .lat{font-size:34px;font-weight:500}
#site{left:0;width:1080px;text-align:center;font:500 38px/1 Tajawal;direction:ltr;color:var(--cream);letter-spacing:.02em}

#fade{inset:0;background:#000;opacity:0}
</style>
</head>
<body>
<div id="stage">
  <img id="photo" class="abs" alt="">
  <div id="shade" class="abs"></div>

  <div id="logo" class="abs"><img src="../../brand/logos/tamaynut.png" alt="Tamaynut"></div>
  <div id="prog" class="abs tf"></div>

  <div id="halo" class="abs"><span class="tf" id="haloTxt"></span></div>
  <div id="song" class="abs"><span class="tf" id="songTxt"></span></div>
  <div id="orn" class="abs"><i></i><img src="../../brand/motifs/diamond.svg" alt=""><i></i></div>
  <div id="artist" class="abs tf"></div>

  <div id="fb" class="abs">
    <svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="50" fill="#1877F2"/>
      <path d="M55 100V61h13l2-15H55v-9c0-4 1-7 7-7h8V17c-1 0-6-1-12-1-12 0-19 7-19 20v10H26v15h13v39z" fill="#fff"/></svg>
    <span class="tf" id="fbTf"></span><span class="lat" id="fbLat"></span>
  </div>
  <div id="site" class="abs"></div>

  <canvas id="grain" class="abs" width="540" height="960"></canvas>
  <div id="fade" class="abs"></div>
</div>

<script>
/* ═══════════ النصوص ═══════════ */
const TEXT = {
  prog: 'ⴰⵎⴰⵔⴳ',                       // اسم البرنامج
  song: 'ⵉⵏⵏⴰ ⵃⵏⵏⴰ ⵙ ⵓⵃⴱⵉⴱ ⵉⵏⵓ',        // اسم الأغنية
  artist: 'ⵎⴱⴰⵕⴽ ⴰⵢⵉⵙⴰⵔ',                // اسم الفنان
  fbTf: 'ⵜⴰⵎⴰⵢⵏⵓⵜ ⵉⵃⴰⵃⴰⵏ',
  fbLat: ' - Tamaynut Ihahan',
  site: 'tamaynut-ihahan.org',
};

/* ═══════════ الإعدادات (من config.json عبر render.js) ═══════════ */
const CFG = Object.assign({ photo: 'in/photo.jpg', photoX: 150, duration: 28 }, window.__CFG__ || {});

/* ═══════════ التوقيت (ثوانٍ) ═══════════ */
const TL = {
  bg: [0, 2.0],            // الخلفية تظهر تدريجيا
  logo: [0.3, 1.5],
  prog: [1.0, 2.0],
  song: [2.0, 4.0],        // ظهور + تكبير 0.9 → 1.0، ثم نبض ±2%
  pulse: 2.6,              // مدة النبضة
  artist: [4.0, 5.0],
  site: [5.0, 6.0],        // فيسبوك والموقع، حتى النهاية
  fadeOut: 1.0,            // آخر ثانية
};

/* ═══════════ الهندسة ═══════════ */
const Y = { song: 1400, orn: 1500, artist: 1570, fb: 1730, site: 1805 };

/* ═══════════ أدوات ═══════════ */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = k => k * k * (3 - 2 * k);
const seg = (t, [a, b]) => ease(clamp((t - a) / (b - a)));
const $ = id => document.getElementById(id);
const atY = (el, cy, extra = '') => { el.style.transform = `translateY(${cy - el.offsetHeight / 2}px) ${extra}`; };

/* ═══════════ بناء العناصر ═══════════ */
$('prog').textContent = TEXT.prog;
$('songTxt').textContent = $('haloTxt').textContent = TEXT.song;
$('artist').textContent = TEXT.artist;
$('fbTf').textContent = TEXT.fbTf;
$('fbLat').textContent = TEXT.fbLat;
$('site').textContent = TEXT.site;
$('photo').src = CFG.photo;

// حُبيبات: ضجيج ثابت البذرة، يتجدد كل 3 إطارات (يبقي الملف صغيرا)
const gctx = $('grain').getContext('2d');
const gimg = gctx.createImageData(540, 960);
let lastGrain = -1;
function grain(n) {
  if (n === lastGrain) return;
  lastGrain = n;
  let s = (n + 1) * 2654435761 >>> 0;
  const d = gimg.data;
  for (let i = 0; i < d.length; i += 4) {
    s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0;
    const v = 128 + ((s & 255) - 128) * .2;
    d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255;
  }
  gctx.putImageData(gimg, 0, 0);
}

/* ═══════════ render(t) ═══════════ */
function render(t) {
  const D = CFG.duration;
  const out = 1 - seg(t, [D - TL.fadeOut, D]);     // كل العناصر تتلاشى في آخر ثانية

  // الخلفية: الصورة تملأ الطول، مزاحة أفقيا حتى لا يغطي الشعار الوجه
  const ph = $('photo');
  ph.style.transform = `translateX(${-CFG.photoX}px)`;
  ph.style.opacity = seg(t, TL.bg);
  $('shade').style.opacity = 1;

  $('logo').style.opacity = seg(t, TL.logo) * out;
  $('prog').style.opacity = seg(t, TL.prog) * out;

  // اسم الأغنية
  const k = seg(t, TL.song);
  let sc = .9 + .1 * k, glow = 0;
  if (t > TL.song[1]) {
    const p = Math.sin((t - TL.song[1]) * 2 * Math.PI / TL.pulse);
    sc *= 1 + .02 * p;
    glow = .25 + .2 * (p + 1) / 2;
  }
  atY($('song'), Y.song, `scale(${sc})`);
  $('song').style.opacity = k * out;
  atY($('halo'), Y.song, `scale(${sc})`);
  $('halo').style.opacity = glow * out;

  // اسم الفنان
  const a = seg(t, TL.artist);
  atY($('orn'), Y.orn);
  $('orn').style.opacity = a * out;
  atY($('artist'), Y.artist + 12 * (1 - a));
  $('artist').style.opacity = a * out;

  // فيسبوك والموقع
  const s = seg(t, TL.site);
  atY($('fb'), Y.fb); $('fb').style.opacity = s * out;
  atY($('site'), Y.site); $('site').style.opacity = s * out;

  grain(Math.floor(t * 30 / 3));
  $('fade').style.opacity = 1 - out;   // إلى الأسود مع النهاية
}

/* حجم اسم الأغنية: أكبر حجم يتسع في 960px */
function fitSong() {
  let size = 130;
  const el = $('songTxt');
  for (; size > 40; size -= 2) {
    document.documentElement.style.setProperty('--song-size', size + 'px');
    if (el.getBoundingClientRect().width <= 960) break;
  }
  return size;
}

window.render = render;
window.CFG = CFG;
window.ready = (async () => {
  await document.fonts.load('96px Adlis', TEXT.song + TEXT.prog + TEXT.artist + TEXT.fbTf);
  await document.fonts.load('500 38px Tajawal', TEXT.site);
  await document.fonts.ready;
  await Promise.all([...document.images].map(im => im.decode().catch(() => {})));
  const songSize = fitSong();
  const q = new URLSearchParams(location.search);
  render(parseFloat(q.get('t') || 0));
  return {
    fonts: [...document.fonts].map(f => f.family.replace(/"/g, '') + ':' + f.status),
    photo: $('photo').naturalWidth > 0,
    songSize,
  };
})();
</script>
</body>
</html>
