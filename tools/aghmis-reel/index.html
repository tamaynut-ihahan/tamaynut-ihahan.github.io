<!doctype html>
<html><head><meta charset="utf-8"><title>Aghmis Reel</title>
<style>
@font-face{font-family:Adlis;src:url(../aghmis-video/assets/fonts/Adlis_otf.ttf)}
@font-face{font-family:Tajawal;src:url(../aghmis-video/assets/fonts/Tajawal-Bold.ttf);font-weight:700}
@font-face{font-family:Tajawal;src:url(../aghmis-video/assets/fonts/Tajawal-Regular.ttf);font-weight:400}
:root{--bg:#1A2B5E;--gold:#E9B84A;--cream:#F3EEE3;--blue:#1F56C0;--red:#C9443A;--deep:#111D45}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;
  background:radial-gradient(900px 900px at 50% 38%,#24397a 0%,var(--bg) 60%,#15234d 100%)}
.tf{font-family:Adlis;direction:ltr}
.scene{position:absolute;inset:0;opacity:0;will-change:transform,opacity}
.center{position:absolute;left:0;width:1080px;text-align:center}
.title{top:300px;font-size:60px;color:var(--gold);letter-spacing:1px}
.svg{position:absolute;left:0;top:0}
#url{position:absolute;left:0;top:1440px;width:1080px;display:flex;justify-content:center;align-items:center;gap:16px;
  font:700 32px Tajawal;color:rgba(243,238,227,.85);z-index:20}
#sub{position:absolute;left:120px;width:840px;bottom:520px;display:flex;justify-content:center;z-index:15}
#sub span{display:inline-block;max-width:840px;padding:20px 32px 22px;border-radius:20px;background:rgba(14,22,52,.78);
  color:var(--cream);font-size:52px;line-height:1.38;text-align:center;border:1.5px solid rgba(233,184,74,.35)}
.panel{position:absolute;background:var(--cream);border-radius:34px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
</style></head>
<body><div id="stage">
  <!-- faint diamond texture -->
  <svg class="svg" width="1080" height="1920" style="opacity:.05">
    <defs><pattern id="tx" width="90" height="90" patternUnits="userSpaceOnUse"><path d="M45 15 L75 45 L45 75 L15 45Z" fill="none" stroke="#E9B84A" stroke-width="2"/></pattern></defs>
    <rect width="1080" height="1920" fill="url(#tx)"/></svg>

  <!-- 0 HOOK -->
  <div class="scene" id="s0">
    <div class="center tf" id="hookTxt" style="top:520px;font-size:110px;line-height:1.3;color:var(--cream)">ⵎⴰⴷ ⵉⴳⴰⵏ<br>ⴰⵖⵎⵉⵙ?</div>
    <div id="hookGlow" style="position:absolute;left:390px;top:860px;width:300px;height:300px;border-radius:50%;
      background:radial-gradient(circle,rgba(233,184,74,.55),rgba(233,184,74,0) 65%)"></div>
    <img id="hookDia" src="../aghmis-video/assets/svg/diamond.svg" style="position:absolute;left:470px;top:940px;width:140px;height:140px">
  </div>

  <!-- 1 WHAT -->
  <div class="scene" id="s1">
    <div class="center title tf">ⵎⴰⴷ ⵉⴳⴰⵏ ⴰⵖⵎⵉⵙ?</div>
    <div id="band1" style="position:absolute;top:470px;left:0"></div>
    <svg class="svg" id="lines1" width="1080" height="1920"></svg>
    <img id="dot1" src="../aghmis-video/assets/svg/diamond.svg" style="position:absolute;left:510px;top:1030px;width:60px;height:60px">
  </div>

  <!-- 2 WHO -->
  <div class="scene" id="s2">
    <div class="center title tf">ⵎⴰⴷ ⵉⴱⵉⴷⴷⵏ ⵅⴼ ⵓⵖⵎⵉⵙ?</div>
    <div class="panel" id="logoPanel" style="left:150px;top:520px;width:780px;height:420px;display:flex;align-items:center;justify-content:center">
      <img src="../aghmis-video/assets/logo_tamaynut.png" style="width:690px">
    </div>
    <div id="band2" style="position:absolute;top:1020px;left:150px;width:780px;overflow:hidden;border-radius:14px"></div>
  </div>

  <!-- 3 WHERE -->
  <div class="scene" id="s3">
    <div class="center title tf">ⵎⴰⵏⵉ ⴳ ⵔⴰⴷ ⴰⴼⵖ ⴰⵖⵎⵉⵙ?</div>
    <div id="browser" style="position:absolute;left:120px;top:470px;width:840px;height:600px;border-radius:30px;overflow:hidden;
      background:#FAF7F0;box-shadow:0 26px 70px rgba(0,0,0,.4);border:3px solid #0E1838">
      <div style="height:110px;background:#0E1838;display:flex;align-items:center;padding:0 26px;gap:14px">
        <i style="width:20px;height:20px;border-radius:50%;background:#C9443A"></i>
        <i style="width:20px;height:20px;border-radius:50%;background:#E9B84A"></i>
        <i style="width:20px;height:20px;border-radius:50%;background:#7E8BB0"></i>
        <div style="flex:1;margin-left:16px;height:64px;border-radius:16px;background:#F3EEE3;display:flex;align-items:center;padding:0 24px;
          font:700 36px Tajawal;color:#1A2B5E"><span id="typed"></span><b id="caret" style="display:inline-block;width:3px;height:40px;background:#1F56C0;margin-left:4px"></b></div>
      </div>
      <div class="tf" style="position:absolute;top:150px;width:100%;text-align:center;font-size:140px;color:var(--blue);line-height:1">ⴰⵖⵎⵉⵙ</div>
      <div style="position:absolute;top:330px;width:100%;display:flex;justify-content:center;align-items:center;gap:22px">
        <i style="width:130px;height:3px;background:#7E8BB0"></i><span class="tf" style="font-size:40px;color:var(--bg)">ⵏ ⵜⵎⴰⵢⵏⵓⵜ</span><i style="width:130px;height:3px;background:#7E8BB0"></i></div>
      <div id="band3" style="position:absolute;bottom:0;left:0"></div>
    </div>
  </div>

  <!-- 4 JOIN -->
  <div class="scene" id="s4">
    <div id="env" style="position:absolute;left:120px;top:330px;width:840px;height:470px;border-radius:24px;overflow:hidden;background:#FAF7F0;
      border:3px solid #0E1838;box-shadow:0 26px 70px rgba(0,0,0,.4)">
      <div id="band4a" style="position:absolute;top:0;left:0"></div>
      <div id="band4b" style="position:absolute;bottom:0;left:0"></div>
      <svg class="svg" width="840" height="470"><path id="flap" d="M0 78 L420 300 L840 78" fill="none" stroke="#7E8BB0" stroke-width="4"/>
        <g stroke="#cfcac0" stroke-width="5"><line x1="230" y1="330" x2="610" y2="330"/><line x1="230" y1="358" x2="610" y2="358"/><line x1="230" y1="386" x2="430" y2="386"/></g></svg>
      <div id="stamp" style="position:absolute;right:46px;top:110px;width:140px;height:160px;border:4px dashed var(--blue);background:#F3EEE3;
        display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px">
        <span class="tf" style="font-size:40px;color:var(--blue)">ⴰⵖⵎⵉⵙ</span><img src="../aghmis-video/assets/svg/diamond.svg" style="width:50px"></div>
    </div>
    <div id="mail" style="position:absolute;left:120px;top:880px;width:840px;height:150px;border-radius:30px;background:var(--blue);
      display:flex;align-items:center;justify-content:center;font:700 54px Tajawal;color:#fff;letter-spacing:.5px;
      box-shadow:0 0 0 4px rgba(233,184,74,.9),0 20px 50px rgba(0,0,0,.35)">tamaynut44200@gmail.com</div>
  </div>

  <!-- 5 OUTRO -->
  <div class="scene" id="s5">
    <div class="panel" id="outPanel" style="left:130px;top:300px;width:820px;height:900px">
      <img src="../aghmis-video/assets/logo_tamaynut.png" style="position:absolute;left:105px;top:60px;width:610px">
      <div style="position:absolute;left:110px;top:380px;width:600px;height:3px;background:rgba(26,43,94,.18)"></div>
      <div class="tf" style="position:absolute;top:430px;width:100%;text-align:center;font-size:170px;line-height:1;color:var(--blue)">ⴰⵖⵎⵉⵙ</div>
      <div style="position:absolute;top:650px;width:100%;display:flex;justify-content:center;align-items:center;gap:24px">
        <i style="width:140px;height:3px;background:#7E8BB0"></i><span class="tf" style="font-size:46px;color:var(--bg)">ⵏ ⵜⵎⴰⵢⵏⵓⵜ</span><i style="width:140px;height:3px;background:#7E8BB0"></i></div>
      <div class="tf" style="position:absolute;top:770px;width:100%;text-align:center;font-size:54px;color:var(--red)">ⵜⴰⵎⴰⵢⵏⵓⵜ ⵉⵃⴰⵃⴰⵏ</div>
    </div>
  </div>

  <div id="sub"><span class="tf" id="subTxt"></span></div>
  <div id="url"><img src="../aghmis-video/assets/svg/diamond.svg" style="width:34px;height:34px">tamaynut-ihahan.org</div>
</div>
<script>
const TL = window.__TL__;  // injected by render.js from out/timeline.json
const $ = id => document.getElementById(id);
const clamp = (x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease = x => { x=clamp(x); return 1-Math.pow(1-x,3); };
const back = x => { x=clamp(x); const c=1.7; return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2); };

// diamond strip: blue band, diamonds like assets/svg/diamond.svg, touching tip to tip
function strip(width, cell){
  const n=Math.ceil(width/cell)+1, h=cell; let g='';
  for(let i=0;i<n;i++){const x=i*cell, c=x+cell/2, m=h/2, s=cell/100;
    const d=(r)=>`M${c} ${m-r*s} L${c+r*s} ${m} L${c} ${m+r*s} L${c-r*s} ${m}Z`;
    g+=`<path d="${d(48)}" fill="#F3EEE3"/><path d="${d(40)}" fill="#E9B84A"/><path d="${d(19)}" fill="#C9443A"/><circle cx="${c}" cy="${m}" r="${6*s}" fill="#FBF8F1"/>`;}
  return `<svg width="${width}" height="${h}" style="display:block"><rect width="${width}" height="${h}" fill="#1F56C0"/>${g}</svg>`;
}
$('band1').innerHTML=strip(1320,120);
$('band2').innerHTML=strip(780,780/8);
$('band3').innerHTML=strip(924,84);
$('band4a').innerHTML=strip(840,840/12); $('band4b').innerHTML=strip(840,840/12);
// converging curves (intro_card_1)
(function(){const cell=120, py=1040, px=540; let s='';
  for(let i=0;i<9;i++){const x=i*cell+cell/2; s+=`<path class="cv" d="M${x} 590 C ${x} ${760}, ${px+(x-px)*0.25} ${py-140}, ${px} ${py}" fill="none" stroke="#8FA6E0" stroke-width="3" stroke-opacity=".8"/>`;}
  $('lines1').innerHTML=s; document.querySelectorAll('.cv').forEach(p=>{const L=p.getTotalLength();p.dataset.len=L;p.style.strokeDasharray=L;});
})();

function sceneAlpha(t, s, first, last){
  const fin = first ? 1 : ease((t-s.start)/0.35);
  const fout = last ? 1 : 1-ease((t-(s.end-0.3))/0.3);
  return clamp(Math.min(fin,fout));
}
function render(t){
  TL.scenes.forEach((s,i)=>{
    const el=$('s'+s.id); const vis = t>=s.start-0.01 && t<s.end+0.01;
    if(!vis){el.style.opacity=0;return;}
    const a=sceneAlpha(t,s,i===0,i===TL.scenes.length-1);
    const lt=t-s.start, rise=(1-ease(lt/0.5))*40;
    el.style.opacity=a; el.style.transform=`translateY(${rise}px)`;
    if(s.id===0){
      const p=clamp((lt-0.1)/0.4);
      $('hookTxt').style.opacity=ease(p*1.4);
      $('hookTxt').style.transform=`scale(${1.35-0.35*back(p)})`;
      const dp=ease((lt-0.35)/0.4), pulse=0.5+0.5*Math.sin(lt*4.2);
      $('hookDia').style.transform=`scale(${dp}) rotate(${(1-dp)*-90}deg)`;
      $('hookGlow').style.opacity=dp*(0.55+0.45*pulse);
      $('hookGlow').style.transform=`scale(${0.9+0.25*pulse})`;
    }
    if(s.id===1){
      $('band1').style.transform=`translateX(${(1-ease(lt/0.6))*1080 - lt*6}px)`;
      document.querySelectorAll('.cv').forEach((p,k)=>{const L=+p.dataset.len; const q=ease((lt-0.5-Math.abs(k-4)*0.08)/1.4); p.style.strokeDashoffset=L*(1-q);});
      const q=ease((lt-1.8)/0.4); $('dot1').style.transform=`scale(${q*(1+0.12*Math.sin(lt*4))})`;
    }
    if(s.id===2){
      $('logoPanel').style.transform=`scale(${0.85+0.15*back(lt/0.6)})`; $('logoPanel').style.opacity=ease(lt/0.4);
      $('band2').style.clipPath=`inset(0 ${100-100*ease((lt-0.4)/0.9)}% 0 0)`;
    }
    if(s.id===3){
      $('browser').style.transform=`scale(${0.9+0.1*back(lt/0.6)})`;
      const url='tamaynut-ihahan.org', n=Math.floor(clamp((lt-0.45)/1.3)*url.length);
      $('typed').textContent=url.slice(0,n); $('caret').style.opacity=(Math.floor(lt*2.5)%2)?0.15:1;
      $('band3').style.transform=`translateX(${-((lt*30)%84)}px)`;
    }
    if(s.id===4){
      $('env').style.transform=`translateY(${(1-back(lt/0.7))*120}px)`;
      $('flap').setAttribute('d',`M0 78 L420 ${300-220*(1-ease((lt-0.3)/0.6))} L840 78`);
      $('stamp').style.transform=`rotate(${-8*(1-ease((lt-0.6)/0.4))}deg) scale(${ease((lt-0.6)/0.4)})`;
      const m=clamp((lt-1.0)/0.5); $('mail').style.opacity=ease(m); $('mail').style.transform=`scale(${0.8+0.2*back(m)})`;
    }
    if(s.id===5){
      $('outPanel').style.transform=`scale(${0.9+0.1*back(lt/0.7)})`;
    }
  });
  // subtitles: current phrase only
  const cur=TL.subs.find(c=>t>=c.start && t<c.end);
  const sub=$('sub'), st=$('subTxt');
  if(cur){ if(st.textContent!==cur.text) st.textContent=cur.text;
    const a=Math.min(ease((t-cur.start)/0.15), 1-ease((t-(cur.end-0.12))/0.12));
    sub.style.opacity=a; sub.style.transform=`translateY(${(1-ease((t-cur.start)/0.2))*14}px)`;
  } else { sub.style.opacity=0; }
}
window.render=render;
</script></body></html>
