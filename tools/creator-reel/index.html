<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>creator reel</title>
<!--
  ريلز صانع محتوى: صوره تتتابع بتكبير بطيء وتلاشٍ متقاطع، مع اسمه في البداية وبطاقة ختام — 1080×1920.
  كل شيء يُرسم بالدالة render(t) (t بالثواني)، فكل إطار حتمي.
  - الصور والاسم والمدة: config.json (يمررها render.js في window.__CFG__).
  - التوقيت: الكائن TL.
-->
<style>
@font-face{font-family:Tajawal;font-weight:500;src:url(../../brand/fonts/Tajawal-Medium.ttf) format("truetype");}
@font-face{font-family:Tajawal;font-weight:900;src:url(../../brand/fonts/Tajawal-Black.ttf) format("truetype");}

:root{--navy:#1A2B5E;--blue:#1F56C0;--gold:#E9B84A;--cream:#FBF7EE}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden}
.abs{position:absolute}

/* الشريحة: خلفية ضبابية من الصورة نفسها، والصورة كاملة فوقها */
.slide{inset:0;overflow:hidden}
.slide canvas{position:absolute;left:0;top:0;width:1080px;height:1920px}
.slide img{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:50% 50%}
.slide img.contain{object-fit:contain}
.slide img.cover{object-fit:cover}

/* الاسم في البداية: أسفل الشاشة فوق تعتيم خفيف */
#lowShade{left:0;right:0;bottom:0;height:760px;
  background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.55) 55%,rgba(0,0,0,.75))}
#intro{left:0;width:1080px;top:1500px;text-align:center;color:var(--cream)}
.name{font:900 120px/1.05 Tajawal;direction:ltr;letter-spacing:.01em;text-shadow:0 4px 26px rgba(0,0,0,.6);white-space:nowrap}
.orn{display:flex;align-items:center;justify-content:center;gap:20px;margin:22px auto 0;width:380px}
.orn i{flex:1;height:3px;background:var(--gold)}
.orn img{width:24px;height:24px}
.handle{display:flex;justify-content:center;align-items:center;gap:14px;direction:ltr;margin-top:24px;
  font:500 42px/1 Tajawal;text-shadow:0 2px 14px rgba(0,0,0,.7)}
.handle svg{width:48px;height:48px;flex:none}

/* بطاقة الختام */
#endShade{inset:0;background:rgba(14,22,50,.78)}
#end{left:0;width:1080px;top:0;text-align:center;color:var(--cream)}
#end .name{font-size:132px}
#credit{left:0;width:1080px;bottom:120px;display:flex;flex-direction:column;align-items:center;gap:22px}
#credit .logo{background:var(--cream);border-radius:20px;padding:12px 16px}
#credit .logo img{display:block;width:250px}
#credit .site{font:500 34px/1 Tajawal;direction:ltr;color:var(--cream);letter-spacing:.02em}

#fade{inset:0;background:#000;opacity:0}
</style>
</head>
<body>
<div id="stage">
  <div id="slides"></div>

  <div id="lowShade" class="abs"></div>
  <div id="intro" class="abs">
    <div class="name"></div>
    <div class="orn"><i></i><img src="../../brand/motifs/diamond.svg" alt=""><i></i></div>
    <div class="handle"></div>
  </div>

  <div id="endShade" class="abs"></div>
  <div id="end" class="abs">
    <div class="name"></div>
    <div class="orn"><i></i><img src="../../brand/motifs/diamond.svg" alt=""><i></i></div>
    <div class="handle"></div>
  </div>
  <div id="credit" class="abs">
    <div class="logo"><img src="../../brand/logos/tamaynut.png" alt="Tamaynut"></div>
    <div class="site">tamaynut-ihahan.org</div>
  </div>

  <div id="fade" class="abs"></div>
</div>

<script>
/* ═══════════ الإعدادات (من config.json عبر render.js) ═══════════ */
const CFG = Object.assign({ list: [], duration: 40, creator: '', handle: '', brand: true, fit: 'auto' },
  window.__CFG__ || {});

/* ═══════════ التوقيت (ثوانٍ) ═══════════ */
const TL = {
  intro: [0.4, 1.4],       // الاسم يظهر
  introOut: [4.2, 5.0],    // ثم يختفي
  end: 4.0,                // بطاقة الختام: آخر 4 ث فوق آخر صورة
  xfade: 0.8,              // التلاشي المتقاطع بين صورتين
  zoom: 0.08,              // التكبير البطيء خلال الشريحة (8%)
  fadeOut: 0.6,            // إلى الأسود في النهاية
};

/* ═══════════ أدوات ═══════════ */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = k => k * k * (3 - 2 * k);
const seg = (t, [a, b]) => ease(clamp((t - a) / (b - a)));
const $ = id => document.getElementById(id);
const atY = (el, cy) => { el.style.transform = `translateY(${cy - el.offsetHeight / 2}px)`; };

const FB = '<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="50" fill="#1877F2"/>' +
  '<path d="M55 100V61h13l2-15H55v-9c0-4 1-7 7-7h8V17c-1 0-6-1-12-1-12 0-19 7-19 20v10H26v15h13v39z" fill="#fff"/></svg>';

/* ═══════════ بناء العناصر ═══════════ */
for (const box of [$('intro'), $('end')]) {
  box.querySelector('.name').textContent = CFG.creator;
  const h = box.querySelector('.handle');
  if (CFG.handle) { h.innerHTML = FB; h.append(Object.assign(document.createElement('span'), { textContent: CFG.handle })); }
  else h.remove();
}
if (!CFG.brand) $('credit').remove();

const slides = CFG.list.map(src => {
  const d = document.createElement('div'); d.className = 'slide abs';
  const c = document.createElement('canvas'); c.width = 270; c.height = 480;
  const im = new Image(); im.src = src;
  d.append(c, im); $('slides').append(d);
  return { d, c, im };
});

// الخلفية الضبابية تُرسم مرة واحدة لكل صورة؛ والصورة القريبة من 9:16 تملأ الشاشة
function prepare(s) {
  const { c, im } = s, w = im.naturalWidth, h = im.naturalHeight;
  const x = c.getContext('2d'), k = Math.max(c.width / w, c.height / h) * 1.15;
  x.filter = 'blur(10px) brightness(.7) saturate(1.1)';
  x.drawImage(im, (c.width - w * k) / 2, (c.height - h * k) / 2, w * k, h * k);
  const fit = CFG.fit === 'auto' ? (w / h <= 0.65 ? 'cover' : 'contain') : CFG.fit;
  im.className = fit;
}

/* ═══════════ render(t) ═══════════ */
function render(t) {
  const D = CFG.duration, N = slides.length, S = D / N, X = Math.min(TL.xfade, S * .3);
  const out = 1 - seg(t, [D - TL.fadeOut, D]);

  slides.forEach((s, i) => {
    const a = i * S;                                  // بداية الشريحة
    const vis = t >= a - X && t < a + S + X;
    s.d.style.display = vis ? '' : 'none';
    if (!vis) return;
    s.d.style.opacity = i === 0 ? 1 : clamp((t - a + X) / X);   // تظهر فوق السابقة
    const k = clamp((t - a + X) / (S + 2 * X));       // تقدم الشريحة 0 → 1
    const z = i % 2 ? 1 + TL.zoom * (1 - k) : 1 + TL.zoom * k;   // تكبير ثم تصغير بالتناوب
    const dx = (i % 3 - 1) * 18 * (k - .5);           // انزياح أفقي خفيف
    s.im.style.transform = `translateX(${dx}px) scale(${z})`;
    s.c.style.transform = `scale(${1 + .04 * k})`;
  });

  // الاسم في البداية
  const ii = seg(t, TL.intro) * (1 - seg(t, TL.introOut));
  $('lowShade').style.opacity = ii;
  $('intro').style.opacity = ii;
  $('intro').style.transform = `translateY(${20 * (1 - seg(t, TL.intro))}px)`;

  // بطاقة الختام
  const e = seg(t, [D - TL.end, D - TL.end + 0.8]);
  $('endShade').style.opacity = e;
  $('end').style.opacity = e;
  atY($('end'), 860 + 20 * (1 - e));
  if ($('credit')) $('credit').style.opacity = seg(t, [D - TL.end + 0.6, D - TL.end + 1.4]);

  $('fade').style.opacity = 1 - out;
}

/* حجم الاسم: أكبر حجم يتسع في 960px */
function fitName() {
  for (const el of document.querySelectorAll('.name')) {
    let size = parseFloat(getComputedStyle(el).fontSize);
    el.style.display = 'inline-block';
    while (size > 50 && el.getBoundingClientRect().width > 960) el.style.fontSize = (size -= 2) + 'px';
    el.style.display = '';
  }
}

window.render = render;
window.ready = (async () => {
  await document.fonts.load('900 120px Tajawal', CFG.creator);
  await document.fonts.load('500 42px Tajawal', CFG.handle + 'tamaynut-ihahan.org');
  await document.fonts.ready;
  await Promise.all([...document.images].map(im => im.decode().catch(() => {})));
  slides.filter(s => s.im.naturalWidth).forEach(prepare);
  fitName();
  render(0);
  const S = CFG.duration / slides.length;
  return {
    fonts: [...document.fonts].map(f => f.family.replace(/"/g, '') + ':' + f.status),
    photos: slides.filter(s => s.im.naturalWidth).length,
    slide: S,
  };
})();
</script>
</body>
</html>
