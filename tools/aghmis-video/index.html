<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>ⴰⵖⵎⵉⵙ — launch video</title>
<!--
  فيديو إطلاق ⴰⴼⵔⴰⴳ ⵏ ⵜⵎⴰⴳⵉⵜ — 1080×1920 (أو 1080×1350 مع ?format=4x5)، 30 ث.
  كل شيء يُرسم بالدالة render(t) (t بالثواني). لا توجد أي حركة CSS تلقائية،
  لذلك كل إطار حتمي ويمكن التقاطه بأي ترتيب.
  - النصوص: الكائن TEXT أسفله.
  - التوقيت: الكائن TL أسفله.
  - المعاينة في المتصفح: افتح الصفحة عبر خادم محلي، ثم ?t=12 لإطار ثابت أو ?play للتشغيل.
-->
<style>
@font-face{font-family:Adlis;src:url(../../brand/fonts/Adlis-tt.ttf) format("truetype");}
@font-face{font-family:Tajawal;font-weight:400;src:url(../../brand/fonts/Tajawal-Regular.ttf) format("truetype");}
@font-face{font-family:Tajawal;font-weight:700;src:url(../../brand/fonts/Tajawal-Bold.ttf) format("truetype");}

:root{--night:#1A2B5E;--blue:#1F56C0;--gold:#E9B84A;--red:#C9443A;--cream:#F3EEE3}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--night)}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Tajawal;
  background:radial-gradient(ellipse 75% 50% at 50% 48%, #24397A 0%, #1A2B5E 58%, #121E47 100%)}
.abs{position:absolute}
.tf{font-family:Adlis;direction:ltr;unicode-bidi:isolate}
.ar{font-family:Tajawal;direction:rtl}
.lat{font-family:Tajawal;direction:ltr}

#bgGlow{inset:0;background:radial-gradient(circle at 540px 960px, rgba(233,184,74,.22) 0, rgba(233,184,74,.07) 260px, rgba(233,184,74,0) 560px)}

/* ── 1–2. المعيّن، الشريط، الخطوط ── */
#hero{left:0;top:0;width:170px;height:170px;transform-origin:50% 50%}
#band{left:0;top:652px;width:1080px;height:96px;background:var(--blue);transform-origin:50% 50%}
.dm{left:0;top:0;width:96px;height:96px}
#lines{left:0;top:0;width:1080px;height:1920px;overflow:visible}

/* ── 3. الباب ── */
#door{left:0;top:0;width:600px;height:860px;transform-origin:50% 50%}
#door .light{left:40px;top:40px;width:520px;height:800px;clip-path:url(#archClip);
  background:radial-gradient(ellipse 60% 55% at 50% 52%, #FFF8E2 0%, #F8E3A6 45%, #E9B84A 100%)}
#door .opening{left:40px;top:40px;width:520px;height:800px;clip-path:url(#archClip);perspective:1300px}
#door .leaf{top:44px;width:260px;height:756px;background:url(../../brand/motifs/door_leaf.svg) center/100% 100% no-repeat;
  box-shadow:0 0 0 1px rgba(0,0,0,.15)}
#door .leaf.l{left:0;transform-origin:0 50%}
#door .leaf.r{left:260px;transform-origin:100% 50%}
#door .leaf .shade{position:absolute;inset:0;background:#000;opacity:0}
#door .frame{left:0;top:0;width:600px;height:860px;overflow:visible}
#door .sill{left:-30px;top:836px;width:660px;height:34px;background:#0F1A3D;border-radius:6px;
  box-shadow:inset 0 3px 0 rgba(233,184,74,.55)}

#flood{inset:0}

/* ── 4. أسماء الأبواب ── */
.name{left:120px;width:840px;top:0;text-align:center;opacity:0}
.name .tf{font-size:96px;line-height:1.15;color:var(--blue)}
.name .ar{font-size:44px;font-weight:700;line-height:1.3;color:var(--night);margin-top:14px}

/* ── 5. الكتاب ثلاثي الأبعاد (من references/book_3d.html) ── */
#bookScene{left:0;top:0;width:500px;height:705.3px;perspective:2400px;transform-origin:50% 50%}
#book{position:relative;width:500px;height:705.3px;transform-style:preserve-3d}
#book .face{position:absolute;backface-visibility:hidden}
#book .front{left:0;top:0;width:500px;height:705.3px;transform:translateZ(20px);overflow:hidden}
#book .front img{display:block;width:100%;height:100%;object-fit:contain}
#book .front::after{content:"";position:absolute;inset:0;background:
  linear-gradient(90deg, rgba(0,0,0,.28) 0, rgba(255,255,255,.18) 5px, rgba(0,0,0,.08) 12px, transparent 22px),
  linear-gradient(115deg, rgba(255,255,255,.16) 0%, rgba(255,255,255,0) 38%, rgba(0,0,0,.06) 100%)}
#book .spine{width:40px;height:705.3px;left:230px;top:0;transform:rotateY(-90deg) translateZ(250px);
  background:linear-gradient(90deg,#0F1A3D,#1F2F66 55%,#16244F);display:flex;align-items:center;justify-content:center}
#book .spine span{font-family:Adlis;color:var(--gold);font-size:22px;white-space:nowrap;transform:rotate(90deg);letter-spacing:.08em}
#book .top{width:500px;height:40px;left:0;top:332.65px;transform:rotateX(90deg) translateZ(352.65px);
  background:repeating-linear-gradient(0deg,#F6F1E6 0 2px,#E4DCCB 2px 3px)}
#bookShadow{left:0;top:0;width:640px;height:70px;
  background:radial-gradient(ellipse at center, rgba(0,0,0,.55) 0%, rgba(0,0,0,0) 70%);filter:blur(6px);transform-origin:50% 50%}

/* ── 6. الخاتمة ── */
#kick{left:120px;width:840px;top:282px;text-align:center}
#kick .tf{font-size:72px;line-height:1.15;color:var(--gold);letter-spacing:.04em}
#kick .ar{font-size:40px;line-height:1.3;color:var(--cream);margin-top:6px}
#panel{left:540px;top:1050px;transform:translateX(-50%);background:var(--cream);border-radius:28px;
  display:flex;align-items:center;gap:30px;padding:26px 44px;box-shadow:0 18px 50px rgba(0,0,0,.28)}
#panel img{height:112px;display:block}
#panel .sep{width:2px;height:96px;background:var(--night);opacity:.22}
#panel .m .big{font-family:Adlis;font-size:66px;color:var(--blue);line-height:1;text-align:center}
#panel .m .sub{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:8px}
#panel .m .sub i{display:block;width:46px;height:2px;background:var(--night);opacity:.5}
#panel .m .sub span{font-family:Adlis;font-size:20px;color:var(--night);white-space:nowrap}
#fb{left:120px;width:840px;top:1464px;height:40px;display:flex;align-items:center;justify-content:center;gap:16px;direction:ltr}
#fb .pill{font:700 22px/1 Tajawal;color:var(--night);background:var(--gold);border-radius:8px;padding:8px 14px 6px}
#fb .txt{font-size:28px;color:var(--cream);white-space:nowrap}
#fb .txt .tf{font-size:27px}

/* ── الموقع: ظاهر من 0 إلى 30 ث ── */
#site{left:0;width:1080px;top:0;display:flex;justify-content:center;align-items:baseline;gap:.42em;
  font-family:Tajawal;font-weight:700;direction:ltr;white-space:nowrap;letter-spacing:.02em}
#site .d{display:inline-block;width:.36em;height:.36em;background:var(--gold);transform:translateY(-.12em) rotate(45deg)}
#siteProbe{display:inline-block;width:0;height:0;vertical-align:baseline}

#fade{inset:0;background:#0B1330;opacity:0}
</style>
</head>
<body>
<div id="stage">
  <div id="bgGlow" class="abs"></div>

  <!-- 1–2 -->
  <div id="band" class="abs"></div>
  <div id="dms"></div>
  <svg id="lines" class="abs" viewBox="0 0 1080 1920">
    <defs>
      <radialGradient id="ptGlow"><stop offset="0" stop-color="#FFF8E2"/><stop offset=".35" stop-color="#E9B84A" stop-opacity=".9"/><stop offset="1" stop-color="#E9B84A" stop-opacity="0"/></radialGradient>
    </defs>
    <g id="curves" fill="none" stroke-linecap="round"></g>
    <circle id="ptHalo" cx="540" cy="1100" r="60" fill="url(#ptGlow)" opacity="0"/>
    <path id="ptCore" d="M0 -14 L10 0 L0 14 L-10 0 Z" fill="#E9B84A" opacity="0"/>
  </svg>
  <img id="hero" class="abs" src="../../brand/motifs/diamond.svg" alt="">

  <!-- 3 -->
  <div id="door" class="abs">
    <div class="light abs"></div>
    <div class="opening abs">
      <div class="leaf l abs"><div class="shade"></div></div>
      <div class="leaf r abs"><div class="shade"></div></div>
    </div>
    <svg class="frame abs" viewBox="0 0 600 860">
      <defs>
        <!-- فتحة الباب: مستطيل بقوس نصف دائري (إحداثيات داخل .opening) -->
        <clipPath id="archClip" clipPathUnits="userSpaceOnUse"><path d="M0 800 L0 260 A260 260 0 0 1 520 260 L520 800 Z"/></clipPath>
      </defs>
      <path d="M22 846 L22 300 A278 278 0 0 1 578 300 L578 846" fill="none" stroke="#1F56C0" stroke-width="40"/>
      <path d="M44 846 L44 300 A256 256 0 0 1 556 300 L556 846" fill="none" stroke="#E9B84A" stroke-width="3.5"/>
      <path d="M4 846 L4 300 A296 296 0 0 1 596 300 L596 846" fill="none" stroke="#2A64D2" stroke-width="3" opacity=".6"/>
    </svg>
    <div class="sill abs"></div>
  </div>

  <div id="flood" class="abs"></div>

  <!-- 4 -->
  <div id="names"></div>

  <!-- 5 -->
  <div id="bookShadow" class="abs"></div>
  <div id="bookScene" class="abs"><div id="book">
    <div class="face top"></div>
    <div class="face spine"><span class="tf" id="spineTxt"></span></div>
    <div class="face front"><img src="assets/cover.png" alt=""></div>
  </div></div>

  <!-- 6 -->
  <div id="kick" class="abs"><div class="tf" id="kickTf"></div><div class="ar" id="kickAr"></div></div>
  <div id="panel" class="abs">
    <img src="../../brand/logos/tamaynut.png" alt="Tamaynut">
    <span class="sep"></span>
    <div class="m"><div class="big" id="mBig"></div><div class="sub"><i></i><span id="mSub"></span><i></i></div></div>
  </div>
  <div id="fb" class="abs"><span class="pill">Facebook</span><span class="txt"><span class="tf" id="fbTf"></span><span class="lat" id="fbLat"></span></span></div>

  <div id="site" class="abs"><span class="d"></span><span id="siteTxt"></span><span id="siteProbe"></span></div>

  <div id="fade" class="abs"></div>
</div>

<script>
/* ═══════════ النصوص ═══════════ */
const TEXT = {
  site: 'tamaynut-ihahan.org',
  doors: [
    ['ⵜⴰⵕⵥⵥⵓⵎⵜ', 'الافتتاحية'],
    ['ⵉⵎⴰⴳⵔⴰⴷⵏ', 'مقالات'],
    ['ⴰⵙⵏⴼⵍⵓⵍ', 'إبداع'],
    ['ⵓⴷⵎⴰⵡⵏ', 'وجوه'],
    ['ⵜⴰⵙⴽⵍⴰ ⵜⴰⵎⵉⵡⴰⵏⵜ', 'الأدب الشفوي'],
    ['ⴰⵎⴰⵡⴰⵍ', 'معجم'],
  ],
  kickTf: 'ⴳ ⵎⴰⴷ ⵢⴰⵥⵏ',
  kickAr: 'قريبا',
  mBig: 'ⴰⵖⵎⵉⵙ',
  mSub: 'ⵏ ⵜⵎⴰⵢⵏⵓⵜ',
  fbTf: 'ⵜⴰⵎⴰⵢⵏⵓⵜ ⵉⵃⴰⵃⴰⵏ',
  fbLat: ' - Tamaynut Ihahan',
  spine: 'ⴰⵖⵎⵉⵙ · ⴰⴼⵔⴰⴳ ⵏ ⵜⵎⴰⴳⵉⵜ',
};

/* ═══════════ التوقيت (ثوانٍ) ═══════════ */
const TL = {
  duration: 30,
  heroIn: [0.3, 1.6], heroGrow: [0.3, 4.0],
  heroToBand: [4.0, 5.0],          // المعيّن ينكمش وينتقل إلى y=700
  split: [5.0, 6.3],               // يتضاعف إلى 12 معيّنًا + الشريط
  lines: [6.2, 8.3],               // رسم المنحنيات
  pointGlow: [8.1, 9.0],
  toDoor: [9.0, 9.6],              // الشريط يختفي، النقطة تصعد، الباب يظهر
  doorOpen: [9.6, 12.6],           // rotateY 0→80 (3 ث)
  flood: [11.4, 15.0],             // الضوء يغمر الشاشة
  names: 15.0, nameDur: 1.0, nameFade: 0.2, nameLead: 0.2,   // الاسم يبلغ ذروته على النبضة (15، 16…)
  floodOut: [21.0, 22.4],
  bookIn: [21.2, 24.2], bookTurn: [21.2, 25.6],
  finale: 26.0,
  fadeOut: [29.5, 30.0],
};

/* ═══════════ الهندسة ═══════════ */
/* الصيغة: ?format=9x16 (افتراضي، 1080×1920 للريلز والحالة) أو ?format=4x5 (1080×1350 لمنشورات فيسبوك وواتساب) */
const FORMAT = new URLSearchParams(location.search).get('format') === '4x5' ? '4x5' : '9x16';
const LAYOUTS = {
  '9x16': { H: 1920, heroY: 960, bandY: 700, point: [540, 1100], doorC: [540, 880], doorScale: 1, namesY: 880,
            book: { h: 760, cy: 830, finH: 430, finCy: 752 }, site: [1460, 1440], kickTop: 282, panelTop: 1050, fbTop: 1464 },
  '4x5':  { H: 1350, heroY: 640, bandY: 400, point: [540, 790], doorC: [540, 630], doorScale: .78, namesY: 620,
            book: { h: 640, cy: 610, finH: 430, finCy: 505 }, site: [1250, 1205], kickTop: 66, panelTop: 790, fbTop: 1232 },
};
const LY = LAYOUTS[FORMAT];
const BAND_Y = LY.bandY, POINT = LY.point, DOOR_C = LY.doorC;
const DM_X = Array.from({length:12}, (_, i) => 45 + 90*i);
const [SITE_BASE, SITE_BASE_END] = LY.site;

/* ═══════════ أدوات ═══════════ */
const clamp = (x, a=0, b=1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, [a, b]) => clamp((t - a) / (b - a));
const io = k => k < .5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3) / 2;   // ease-in-out cubic
const out = k => 1 - Math.pow(1 - k, 3);
const inn = k => k*k*k;
const $ = id => document.getElementById(id);
const mixHex = (a, b, k) => {
  const p = h => [1,3,5].map(i => parseInt(h.slice(i, i+2), 16));
  const A = p(a), B = p(b);
  return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], k))).join(',')})`;
};
const place = (el, cx, cy, w, h, extra='') => {
  el.style.transform = `translate(${cx - w/2}px, ${cy - h/2}px) ${extra}`;
};

/* ═══════════ بناء العناصر ═══════════ */
for (const el of [document.documentElement, document.body, $('stage')]) el.style.height = LY.H + 'px';
$('lines').setAttribute('viewBox', `0 0 1080 ${LY.H}`);
$('lines').style.height = LY.H + 'px';
$('bgGlow').style.background = `radial-gradient(circle at 540px ${LY.heroY}px, rgba(233,184,74,.22) 0, rgba(233,184,74,.07) 260px, rgba(233,184,74,0) 560px)`;
$('band').style.top = (BAND_Y - 48) + 'px';
$('ptHalo').setAttribute('cy', POINT[1]);
$('kick').style.top = LY.kickTop + 'px';
$('panel').style.top = LY.panelTop + 'px';
$('fb').style.top = LY.fbTop + 'px';
const dms = DM_X.map(() => {
  const im = document.createElement('img');
  im.src = '../../brand/motifs/diamond.svg'; im.className = 'dm abs'; im.alt = '';
  $('dms').appendChild(im); return im;
});
const curves = DM_X.map((x, i) => {
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  const y0 = BAND_Y + 46, [px, py] = POINT, span = py - y0;
  p.setAttribute('d', `M${x} ${y0} C ${x} ${y0 + .54 * span}, ${lerp(x, px, .55)} ${py - .59 * span}, ${px} ${py}`);
  p.setAttribute('stroke', i % 2 ? '#E9B84A' : '#F3EEE3');
  p.setAttribute('stroke-width', 2.4);
  p.setAttribute('stroke-opacity', .85);
  $('curves').appendChild(p);
  const L = p.getTotalLength();
  p.style.strokeDasharray = L; p.style.strokeDashoffset = L;
  p._L = L; return p;
});
const names = TEXT.doors.map(([tf, ar]) => {
  const d = document.createElement('div');
  d.className = 'name abs';
  d.innerHTML = `<div class="tf"></div><div class="ar"></div>`;
  d.children[0].textContent = tf; d.children[1].textContent = ar;
  $('names').appendChild(d); return d;
});
for (const k of ['kickTf', 'kickAr', 'mBig', 'mSub', 'fbTf', 'fbLat']) $(k).textContent = TEXT[k];
$('siteTxt').textContent = TEXT.site;
$('spineTxt').textContent = TEXT.spine;

const leafL = document.querySelector('#door .leaf.l'), leafR = document.querySelector('#door .leaf.r');
const shadeL = leafL.firstChild, shadeR = leafR.firstChild;
let siteRatio = 0.78;   // (خط الأساس − أعلى الصندوق) / حجم الخط — يُقاس عند التحميل

/* ═══════════ render(t) ═══════════ */
function render(t) {
  /* ── 0–4: المعيّن الأول ── */
  const kIn = out(seg(t, TL.heroIn)), kGrow = io(seg(t, TL.heroGrow));
  const kMove = io(seg(t, TL.heroToBand));
  const heroSize = lerp(170 * lerp(.82, 1, kGrow), 96, kMove);
  const heroY = lerp(LY.heroY, BAND_Y, kMove);
  const hero = $('hero');
  hero.style.width = hero.style.height = heroSize + 'px';
  place(hero, 540, heroY, heroSize, heroSize);
  const pulse = .5 + .5 * Math.sin(t * 2.2);
  const glow = (1 - kMove) * kIn * (18 + 10 * pulse);
  hero.style.filter = glow > .5 ? `drop-shadow(0 0 ${glow}px rgba(233,184,74,.75))` : 'none';
  hero.style.opacity = t < TL.split[0] ? kIn : 0;
  $('bgGlow').style.opacity = kIn * (1 - kMove * .6) * (1 - seg(t, TL.toDoor));

  /* ── 4–9: شريط المعيّنات والمنحنيات ── */
  const kSplit = seg(t, TL.split), kGone = seg(t, TL.toDoor);
  const bandAlpha = 1 - io(kGone), lift = -60 * io(kGone);
  $('band').style.transform = `translateY(${lift}px) scaleX(${io(kSplit)})`;
  $('band').style.opacity = t >= TL.split[0] ? bandAlpha : 0;
  dms.forEach((im, i) => {
    const dist = Math.abs(DM_X[i] - 540) / 495;
    const k = out(clamp((kSplit - dist * .25) / .75));
    place(im, lerp(540, DM_X[i], k), BAND_Y + lift, 96, 96);
    im.style.opacity = t >= TL.split[0] ? bandAlpha : 0;
  });
  curves.forEach((p, i) => {
    const d = Math.abs(i - 5.5) / 5.5;
    const [a, b] = TL.lines;
    const k = io(clamp((t - (a + d * .45)) / (b - a - .45)));
    p.style.strokeDashoffset = p._L * (1 - k);
    p.style.opacity = bandAlpha;
  });
  $('curves').setAttribute('transform', `translate(0 ${lift})`);

  // النقطة: تتوهج ثم تصعد إلى مركز الباب
  const kPt = out(seg(t, TL.pointGlow));
  const ptY = lerp(POINT[1], DOOR_C[1], io(kGone));
  const ptFade = 1 - seg(t, [TL.toDoor[1], TL.toDoor[1] + .5]);
  $('ptHalo').setAttribute('cy', ptY);
  $('ptHalo').setAttribute('r', (40 + 30 * kPt + 8 * pulse) * (1 + kGone));
  $('ptHalo').setAttribute('opacity', kPt * ptFade);
  $('ptCore').setAttribute('transform', `translate(540 ${ptY}) scale(${.4 + .6 * kPt})`);
  $('ptCore').setAttribute('opacity', kPt * ptFade);

  /* ── 9–15: الباب ── */
  const kDoor = out(seg(t, TL.toDoor));
  const kOpen = io(seg(t, TL.doorOpen));
  const kFlood = seg(t, TL.flood);
  const push = 1 + .14 * io(kFlood);                 // اقتراب خفيف من الباب
  const door = $('door');
  door.style.opacity = t >= TL.toDoor[0] && t < TL.flood[1] ? clamp(kDoor * 1.6) : 0;
  place(door, DOOR_C[0], DOOR_C[1] + 20 * LY.doorScale, 600, 860, `scale(${lerp(.04, 1, kDoor) * push * LY.doorScale})`);
  const ang = 80 * kOpen;
  leafL.style.transform = `rotateY(${ang}deg)`;
  leafR.style.transform = `rotateY(${-ang}deg)`;
  shadeL.style.opacity = shadeR.style.opacity = .45 * kOpen;

  // الضوء الذهبي يغمر الشاشة
  const kOutF = io(seg(t, TL.floodOut));
  const R = lerp(120, 2600, inn(kFlood) * .85 + kFlood * .15);
  const fa = clamp(kFlood * 3) * (1 - kOutF);
  const breathe = t > TL.flood[1] ? 1 + .03 * Math.sin((t - 15) * 1.6) : 1;
  const fy = DOOR_C[1];
  $('flood').style.background = fa > 0 ?
    `radial-gradient(circle at 540px ${fy}px, rgba(255,248,226,${fa}) 0, rgba(250,230,170,${fa}) ${R*.30*breathe}px, rgba(233,184,74,${fa}) ${R*.62}px, rgba(233,184,74,0) ${R}px)` : 'none';
  // كمية الضوء عند الموقع (لتغيير لونه وضمان وضوحه)
  const lightAtSite = fa * clamp((R * .62 - (SITE_BASE - fy)) / 500);

  /* ── 15–21: أسماء الأبواب الستة ── */
  names.forEach((el, i) => {
    const a = TL.names - TL.nameLead + i * TL.nameDur, f = TL.nameFade;
    const k = clamp(Math.min((t - a) / f, (a + TL.nameDur - t) / f));
    const hold = clamp((t - a) / TL.nameDur);
    el.style.opacity = k;
    const h = el.offsetHeight;
    el.style.transform = `translateY(${LY.namesY - h/2 + 18 * (1 - out(clamp((t - a) / .35)))}px) scale(${.97 + .03 * hold})`;
  });

  /* ── 21–26: الكتاب ثلاثي الأبعاد ── */
  const kBook = out(seg(t, TL.bookIn)), kTurn = out(seg(t, TL.bookTurn));
  const kFin = io(seg(t, [TL.finale, TL.finale + 1.3]));
  const bookH = lerp(lerp(180, LY.book.h, kBook), LY.book.finH, kFin);
  const bs = bookH / 705.3;
  const bookCy = lerp(LY.book.cy, LY.book.finCy, kFin);
  const bAlpha = clamp((t - TL.bookIn[0]) / .9);
  const bookScene = $('bookScene');
  bookScene.style.opacity = t >= TL.bookIn[0] ? bAlpha : 0;
  place(bookScene, 540 + 10 * bs, bookCy, 500, 705.3, `scale(${bs})`);
  $('book').style.transform = `rotateY(${lerp(35, 22, kTurn)}deg) rotateX(-5deg)`;
  const sh = $('bookShadow');
  sh.style.opacity = t >= TL.bookIn[0] ? bAlpha * kBook : 0;
  place(sh, 540, bookCy + bookH * .5 + 14 * bs, 640, 70, `scale(${bs * .85}, ${bs})`);

  /* ── 26–30: الخاتمة ── */
  const F = TL.finale;
  const kK = out(seg(t, [F + .2, F + 1.0])), kA = out(seg(t, [F + .5, F + 1.2]));
  const kP = out(seg(t, [F + .8, F + 1.6])), kFb = out(seg(t, [F + 1.2, F + 1.9]));
  $('kickTf').style.opacity = kK;
  $('kickTf').style.transform = `translateY(${24 * (1 - kK)}px)`;
  $('kickAr').style.opacity = kA;
  $('panel').style.opacity = kP;
  $('panel').style.transform = `translateX(-50%) translateY(${30 * (1 - kP)}px)`;
  $('fb').style.opacity = kFb;
  $('fb').style.transform = `translateY(${8 * (1 - kFb)}px)`;

  /* ── الموقع: دائمًا ── */
  const kSite = io(seg(t, [F, F + 1.0]));
  const fs = lerp(34, 56, kSite);
  const base = lerp(SITE_BASE, SITE_BASE_END, kSite);
  const site = $('site');
  site.style.fontSize = fs + 'px';
  site.style.top = (base - siteRatio * fs) + 'px';
  site.style.color = mixHex('#F3EEE3', '#1A2B5E', clamp(lightAtSite * 1.2));
  site.style.opacity = lerp(.85, 1, Math.max(kSite, clamp(lightAtSite * 1.2)));
  site.firstChild.style.background = mixHex('#E9B84A', '#C9443A', clamp(lightAtSite * 1.2));

  $('fade').style.opacity = .38 * seg(t, TL.fadeOut);
}

/* قياس خط الأساس للموقع ليكون في مكانه بالضبط (y≈1460 في 9:16) */
function measureSite() {
  const site = $('site');
  site.style.fontSize = '100px'; site.style.top = '0px'; site.style.transform = 'none';
  const top = site.getBoundingClientRect().top, base = $('siteProbe').getBoundingClientRect().top;
  siteRatio = (base - top) / 100;
}

window.render = render;
window.TL = TL;
window.FORMAT = FORMAT;
window.ready = (async () => {
  await document.fonts.load('96px Adlis', 'ⴰⵖⵎⵉⵙ');
  await document.fonts.load('700 44px Tajawal', 'صدر');
  await document.fonts.load('400 40px Tajawal', 'صدر');
  await document.fonts.ready;
  await Promise.all([...document.images].map(im => im.decode().catch(() => {})));
  measureSite();
  const q = new URLSearchParams(location.search);
  render(parseFloat(q.get('t') || 0));
  if (q.has('play')) {
    const t0 = performance.now();
    const loop = () => { render(((performance.now() - t0) / 1000) % TL.duration); requestAnimationFrame(loop); };
    loop();
  }
  return {
    adlis: [...document.fonts].filter(f => f.family.replace(/"/g, '') === 'Adlis').map(f => f.status),
    tajawal: [...document.fonts].filter(f => f.family.replace(/"/g, '') === 'Tajawal').map(f => f.status),
    siteRatio,
  };
})();
</script>
