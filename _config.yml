url: "https://tamaynut-ihahan.org"
baseurl: ""
lang: ar
locale: ar_MA
timezone: Africa/Casablanca

email: tamaynut44200@gmail.com
address_street: "شارع المقاومة"
address_city: "تمنار"
address_region: "إقليم الصويرة"
facebook: "https://www.facebook.com/profile.php?id=61573979400539"
default_image: /assets/og/default.jpg

# بدون قالب جاهز: التصميم كله في assets/css/main.css
theme: null

markdown: kramdown
kramdown:
  input: GFM
  auto_ids: false

collections:
  activities:
    output: true
    permalink: /activities/:name/
  news:
    output: true
    permalink: /news/:name/

defaults:
  - scope: { path: "", type: activities }
    values: { layout: activity, section: activities }
  - scope: { path: "", type: news }
    values: { layout: news, section: news }

exclude:
  - README.md
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - tools/
  - vendor/
  - node_modules/

# CSS inlined in <head> (_includes/head.html) is minified
sass:
  style: compressed
